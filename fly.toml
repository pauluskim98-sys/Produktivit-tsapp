app = "lifemap-planer-6d4e"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/raum.sqlite"
  LIFEMAP_PUBLIC_ORIGIN = "https://lifemap-planer-6d4e.fly.dev"

[mounts]
  source = "lifemap_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/login"
    timeout = "5s"

